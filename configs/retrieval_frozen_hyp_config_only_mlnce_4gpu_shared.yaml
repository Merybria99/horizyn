seed: 42

logging:
  log_dir: logs/retrieval_frozen_hyp_config_only_mlnce_4gpu_shared
  checkpoint_dir: checkpoints/retrieval_frozen_hyp_config_only_mlnce_4gpu_shared
  checkpoint_monitor: val/balanced_mrr
  checkpoint_mode: max
  save_every_n_epochs: 10
  log_every_n_steps: 1
  wandb:
    enabled: true
    project: horizyn-retrieval-source-collapse
    entity: null
    run_name: frozen_hyp_config_only_mlnce_4gpu_shared
    mode: online
    tags:
      - horizyn
      - source-collapse
      - nr90
      - prott5
      - hyperbolic-enzyme
      - frozen-lorentz-hyperbolic-c0p25
      - sleec-guided-attention
      - multimodal-reaction
      - reactiont5v2
      - unimol2
      - chiro
      - highpair-top1000
      - optional-chiro
      - modality-dropout
      - token-layernorm
      - pseudo-reactions
      - mlnce
      - observed-pairs
      - retrieval-metrics
      - balanced-checkpoint
      - shared-4gpu
    log_model: false

data:
  train_pairs_path: data/standardized/retrieval_training_source_collapse/train_nr90/train_pairs_valid_rxn_pseudo_nonempty_prott5.csv
  train_reactions_path: data/standardized/retrieval_training_source_collapse/train_nr90/train_rxns_valid_rxn_pseudo.csv
  test_pairs_path: data/standardized/retrieval_training_source_collapse/validation/clipzyme_eval/pairs_horizyn_nonempty_prott5.csv
  test_reactions_path: data/standardized/retrieval_training_source_collapse/validation/clipzyme_eval/reactions.csv

  protein_residue_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/fit_proteins_with_clipzyme_eval_prott5_residue.h5

  reaction_representation: multimodal_reaction_attention
  reaction_t5v2_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_reactiont5v2_forward_768_nr90_pseudo_plus_clipzyme_eval.h5
  reaction_unimol2_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_unimol2_84m_nr90_plus_clipzyme_eval_readable_highpair_top1000_merged.h5
  reaction_chiro_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_chiro_256_nr90_plus_clipzyme_eval_highpair_top1000_merged.h5
  reaction_model_dim: 768
  reaction_unimol_dim: 768
  reaction_chiro_dim: 256
  reaction_use_chiro: true
  reaction_allow_missing_unimol2: true
  reaction_allow_missing_chiro: true
  reaction_embedding_in_memory: true
  normalize_molecule_sets_as_self_reactions: true

  train_batch_size: 1536
  retrieval_batch_size: 128
  num_workers: 4
  pin_memory: false

  residue_dim: 1024
  max_protein_tokens: 1022
  protein_truncation: ends_center

model:
  name: ProteinPooledDualModel
  pooling: sleec_guided_attention
  query_encoder_type: multimodal_reaction_attention
  reaction_use_chiro: true
  reaction_chirality_name: chiro
  query_encoder_dims: [512, 4096, 4096, 512]
  target_encoder_dims: [512, 4096, 4096, 512]
  embedding_dim: 512
  reaction_pooling: attention
  reaction_attention_pooling:
    attention_bias: true
    separate_side_poolers: true
  reaction_multimodal_attention:
    hidden_dim: 512
    dropout: 0.0
    modality_dropout: 0.15
    token_layer_norm: true
  sleec_pooling:
    threshold: 0.329
    scorer_hidden_dim: 256
    checkpoint_path: /datastor2/deep-proteins/EnzymeDiscovery/horizyn/checkpoints/SLEEC/sleec_stage1_prott5_uniref90_msa_4gpu_20260601_235157/best.ckpt
    freeze_scorer: true
    initial_bias_scale: 1.0
    train_bias_scale: false
  hyperbolic_encoder:
    checkpoint_path: /datastor2/deep-proteins/EnzymeDiscovery/horizyn/checkpoints/hyperbolic_enzyme/hyperbolic-enzyme-prott5-lorentz-c0p25-b512-4gpu-20260601_150714/best.ckpt
    hyp_dim: 512
    use_tangent: true
    freeze_projector: true
    load_attention_pooler: true
    freeze_attention_pooler: true

training:
  max_epochs: 100
  precision: 32-true
  float32_matmul_precision: high
  learning_rate: 0.0001
  weight_decay: 0.01
  lambda_residue: 0.0
  loss:
    name: FullBatchMLNCELoss
    beta: 10.0
    learn_beta: false
    beta_min: 0.01
    beta_max: 100.0
    positive_pair_source: observed_pairs
  metrics:
    top_k: [1, 10, 100, 1000]
  validation_retrieval_metrics: true
  validation_retrieval_candidate_set: validation
  validation_retrieval_batch_size: 128
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  devices: 4
  accelerator: gpu
  strategy: ddp
  log_attention_stats: true
  attention_logging_interval: 10

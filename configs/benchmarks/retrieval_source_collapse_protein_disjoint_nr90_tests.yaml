version: 1
description: >
  NR90 protein-disjoint held-out retrieval tests for models trained on
  data/standardized/retrieval_training_source_collapse/train_nr90. Positive
  test pairs and candidate IDs exclude proteins with an MMseqs hit to the final
  valid-reaction/nonempty training proteins at min sequence identity 0.90 and
  coverage 0.85 with cov-mode 0.

tasks:
  - name: horizyn_sota
    type: retrieval
    dataset: Horizyn
    task_label: sota_protein_disjoint_nr90
    split: horizyn_original_test_protein_disjoint_nr90
    pairs: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn/test_pairs.csv
    train_pairs: data/sota/train_pairs.csv
    reactions: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn/test_rxns.csv
    candidate_ids: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/horizyn_sota_candidate_ids.txt
    candidate_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    candidate_score_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    directions: [reaction_to_enzyme]
    top_k: [1, 10, 100, 1000]

  - name: reactzyme_time
    type: retrieval
    dataset: ReactZyme
    task_label: time_protein_disjoint_nr90
    split: time_original_test_protein_disjoint_nr90
    pairs: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_time/test_pairs.csv
    train_pairs: data/paper/reactzyme/eval/time/train_pairs.csv
    reactions: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_time/reactions.csv
    candidate_ids: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/reactzyme_time_candidate_ids.txt
    candidate_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    candidate_score_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    directions: [reaction_to_enzyme, enzyme_to_reaction]
    top_k: [1, 2, 3, 4, 5, 10, 20, 50]

  - name: reactzyme_enzyme_smi
    type: retrieval
    dataset: ReactZyme
    task_label: enzyme_smi_protein_disjoint_nr90
    split: enzyme_smi_original_test_protein_disjoint_nr90
    pairs: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_enzyme_smi/test_pairs.csv
    train_pairs: data/paper/reactzyme/eval/enzyme_smi/train_pairs.csv
    reactions: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_enzyme_smi/reactions.csv
    candidate_ids: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/reactzyme_enzyme_smi_candidate_ids.txt
    candidate_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    candidate_score_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    directions: [reaction_to_enzyme, enzyme_to_reaction]
    top_k: [1, 2, 3, 4, 5, 10, 20, 50]

  - name: reactzyme_reaction_smi
    type: retrieval
    dataset: ReactZyme
    task_label: reaction_smi_protein_disjoint_nr90
    split: reaction_smi_original_test_protein_disjoint_nr90
    pairs: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_reaction_smi/test_pairs.csv
    train_pairs: data/paper/reactzyme/eval/reaction_smi/train_pairs.csv
    reactions: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/reactzyme_reaction_smi/reactions.csv
    candidate_ids: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/reactzyme_reaction_smi_candidate_ids.txt
    candidate_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    candidate_score_residue_h5:
      prott5: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_prott5_residue.h5
      esm2: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esm2_650m_residue.h5
      esmc: data/standardized/retrieval_training_source_collapse/test/protein_disjoint_nr90/horizyn_reactzyme_shared_candidates/proteins_esmc_6b_residue.h5
    directions: [reaction_to_enzyme, enzyme_to_reaction]
    top_k: [1, 2, 3, 4, 5, 10, 20, 50]

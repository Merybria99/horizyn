capability_pretraining:
  enabled: true

pretraining_objective: reaction_demand_bio_composite

logging:
  wandb:
    enabled: true
    project: horizyn-retrieval-source-collapse
    entity: omnai
    run_name: enzyme_capability_reaction_demand_bio_composite_v3_4gpu
    mode: online
    tags:
      - horizyn
      - enzyme-capability
      - reaction-demand
      - reaction-to-enzyme-priority
      - enzyme-bio-composite-supcon
      - same-center-hard-negatives
      - prott5-residue-multiquery
      - prot5-mean
      - sleec-pooled
      - lorentz-tangent
      - train-exact-rhea-reconstructed
      - 4gpu
    log_model: false

paths:
  capability_dir: data/processed/capability_features/train_exact_rhea_reconstructed
  train_pairs: data/processed/capability_features/train_exact_rhea_reconstructed/train_pairs_directional_rhea_reconstructed.csv
  reaction_features: data/processed/capability_features/train_exact_rhea_reconstructed/reaction_features.parquet
  reaction_demand_vectors: data/processed/capability_features/train_exact_rhea_reconstructed/reaction_demand_vectors.npz
  reaction_demand_metadata: data/processed/capability_features/train_exact_rhea_reconstructed/reaction_demand_metadata.parquet
  enzyme_capability_labels: data/processed/capability_features/train_exact_rhea_reconstructed/enzyme_capability_labels.parquet
  pair_capability_training: data/processed/capability_features/train_exact_rhea_reconstructed/pair_capability_training.parquet
  enzyme_label_vocabs: data/processed/capability_features/train_exact_rhea_reconstructed/enzyme_label_vocabs.json

  prot5_mean: data/processed/capability_features/train_exact/enzyme_features/prot5_mean.npz
  prot5_sleec: data/processed/capability_features/train_exact/enzyme_features/prot5_sleec.npz
  lorentz_tangent: data/processed/capability_features/train_exact/enzyme_features/lorentz_tangent.npz
  prot5_residue: data/standardized/retrieval_training_source_collapse/train_exact/fit_proteins_with_clipzyme_eval_prott5_residue.h5

  output_dir: outputs/enzyme_capability_pretrain/train_exact_rhea_reaction_demand_bio_composite_v3

data:
  exclude_reactzyme_molecule_set_rows: true
  require_directional_reaction: true
  use_train_pairs_only: true
  non_directional_policy: mask_for_chemistry_loss
  residue_max_tokens: 1022
  residue_truncation: ends_center
  residue_in_memory: false

model:
  capability_mode: factorized_biological
  capability_dim: 256
  family_dim: 256
  hidden_dim: 512
  dropout: 0.1
  use_prot5_mean: true
  use_sleec_pool: true
  use_lorentz: true
  use_sleec_residue_pooling: false
  use_prot5_residue_multiquery_pooling: true
  normalize_inputs: true
  normalize_output: true
  residue_pooling:
    dropout: 0.0
    initial_scale: 0.1
    max_tokens: 1022
    truncation: ends_center
    in_memory: false

reaction_demand_encoder:
  input_dim: 2434
  hidden_dim: 512
  output_dim: 256
  dropout: 0.1
  trainable: true
  freeze_after_epochs: 3

training:
  batch_size: 128
  epochs: 30
  lr: 3.0e-4
  weight_decay: 1.0e-2
  num_workers: 4
  pin_memory: false
  seed: 13
  validation_fraction: 0.05
  checkpoint_monitor: capability_space/r2e_mrr
  checkpoint_mode: max
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: 4
  strategy: ddp_find_unused_parameters_true
  resume_from_checkpoint: outputs/enzyme_capability_pretrain/train_exact_rhea_reaction_demand_bio_composite_v3/last.ckpt
  log_every_n_steps: 10

loss:
  objective: reaction_demand_bio_composite
  capability_temperature: 0.07
  hard_negative_temperature: 0.07

  cap_r2e_weight: 1.0
  cap_e2r_weight: 0.30

  cofactor_subspace_weight: 0.20
  reaction_center_subspace_weight: 0.00
  substrate_subspace_weight: 0.10
  product_subspace_weight: 0.10
  family_e2r_weight: 0.20

  composite_weight: 0.35
  same_center_hard_negative_weight: 0.20
  same_center_hard_negative_margin: 0.10
  composite_positive_threshold: 0.20
  composite_min_positive_families: 2
  composite_min_known_families: 2

  cofactor_weight: 0.10
  reaction_center_weight: 0.00
  substrate_weight: 0.05
  product_weight: 0.05
  global_weight: 0.00

  attribute_bce_weight: 0.05
  factor_diversity_weight: 0.02

  cofactor_bce_weight: 0.00
  core_cofactor_bce_weight: 0.00
  enzyme_derived_cofactor_bce_weight: 0.00
  enzyme_derived_core_cofactor_bce_weight: 0.00
  combined_cofactor_bce_weight: 0.00
  combined_core_cofactor_bce_weight: 0.00
  cofactor_architecture_bce_weight: 0.00
  cofactor_chemistry_bce_weight: 0.00
  metal_ion_bce_weight: 0.00
  auxiliary_participant_bce_weight: 0.00
  reaction_center_bce_weight: 0.00
  substrate_product_bce_weight: 0.00
  substrate_product_transition_bce_weight: 0.00
  reaction_type_bce_weight: 0.00
  ec_weight: 0.00

  mask_missing_attributes: true
  deduplicate_entities_before_loss: true

sampling:
  use_in_batch_negatives: true
  use_stratified_hard_negatives: false
  hard_negative_count: 8
  random_negative_count: 16

export:
  save_vectors: true
  save_checkpoint: true
  vector_filename: enzyme_capability_vectors.npz

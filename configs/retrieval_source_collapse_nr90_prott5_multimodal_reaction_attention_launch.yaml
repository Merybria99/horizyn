seed: 42

logging:
  log_dir: logs/retrieval_source_collapse_nr90_prott5_multimodal_reaction_attention_launch
  checkpoint_dir: checkpoints/retrieval_source_collapse_nr90_prott5_multimodal_reaction_attention_launch
  save_every_n_epochs: 10
  log_every_n_steps: 1
  wandb:
    enabled: true
    project: horizyn-retrieval-source-collapse
    entity: null
    run_name: horizyn-source-collapse-nr90-prott5-drfp-unimol2-chienn-attention-4gpu
    mode: online
    tags:
      - horizyn
      - source-collapse
      - nr90
      - prott5
      - mean-enzyme-pooling
      - multimodal-reaction
      - drfp
      - unimol2
      - chienn
      - mlnce
      - 4gpu
    log_model: false

data:
  train_pairs_path: data/standardized/retrieval_training_source_collapse/train_nr90/train_pairs_valid_rxn_nonempty_prott5.csv
  train_reactions_path: data/standardized/retrieval_training_source_collapse/train_nr90/train_rxns_valid_rxn.csv
  test_pairs_path: data/standardized/retrieval_training_source_collapse/validation/clipzyme_eval/pairs_horizyn_nonempty_prott5.csv
  test_reactions_path: data/standardized/retrieval_training_source_collapse/validation/clipzyme_eval/reactions.csv

  protein_residue_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/fit_proteins_with_clipzyme_eval_prott5_residue.h5

  reaction_representation: multimodal_reaction_attention
  reaction_model_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_drfp_1024_nr90_plus_clipzyme_eval.h5
  reaction_unimol2_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_unimol2_84m_nr90_plus_clipzyme_eval_readable.h5
  reaction_chienn_embeds_path: data/standardized/retrieval_training_source_collapse/train_nr90/rxns_chienn_256_nr90_plus_clipzyme_eval.h5
  reaction_model_dim: 1024
  reaction_unimol_dim: 768
  reaction_chienn_dim: 256
  reaction_embedding_in_memory: true

  train_batch_size: 512
  retrieval_batch_size: 1
  num_workers: 4
  pin_memory: false

  residue_dim: 1024
  max_protein_tokens: 1022
  protein_truncation: ends_center

model:
  name: ProteinPooledDualModel
  pooling: mean
  query_encoder_type: multimodal_reaction_attention
  query_encoder_dims: [512, 4096, 4096, 512]
  target_encoder_dims: [1024, 4096, 4096, 512]
  embedding_dim: 512
  reaction_pooling: attention
  reaction_attention_pooling:
    attention_bias: true
    separate_side_poolers: true
  reaction_multimodal_attention:
    hidden_dim: 512
    dropout: 0.0

training:
  max_epochs: 100
  precision: 32-true
  float32_matmul_precision: high
  learning_rate: 0.0001
  weight_decay: 0.01
  lambda_residue: 0.0
  loss:
    name: FullBatchMLNCELoss
    beta: 10.0
    learn_beta: false
    beta_min: 0.01
    beta_max: 100.0
  metrics:
    top_k: [1, 10, 100, 1000]
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  devices: 4
  accelerator: gpu
  strategy: ddp
  log_attention_stats: true
  attention_logging_interval: 10

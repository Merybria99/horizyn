reaction:
  id: tagatose_4_epimerase
  smiles: "O=C(CO)[C@@H](O)[C@@H](O)[C@H](O)CO>>O=C(CO)[C@@H](O)[C@H](O)[C@H](O)CO"

model:
  name: F3-MC-EC lambda=3 ReactZyme Reaction-Sim, validation-selected epoch 29
  config: runs/reactzyme_f3mc_ec_lambda3_all_splits_v1/configs/reaction_smi/train.yaml
  checkpoint: runs/reactzyme_f3mc_ec_lambda3_all_splits_v1/checkpoints/reaction_smi/train/protein-pooling-epoch=29.ckpt

candidate_pool:
  ids: wet_lab/Case1/restricted_setting/candidate_pool/candidate_ids_prott5_order.txt
  residue_embeddings: wet_lab/Case1/restricted_setting/candidate_pool/proteins_prott5_residue.h5
  fasta: wet_lab/Case1/restricted_setting/candidate_pool/proteins.fasta
  metadata_csv: wet_lab/Case1/restricted_setting/candidate_pool/proteins.csv
  metadata_id_column: entry_id
  target_cache_dir: wet_lab/Case1/restricted_setting/cache/f3mc_ec_lambda3_reaction_smi_unmapped_targets
  protein_embedding: prott5
  score_protein_embedding: prott5
  residue_load_dtype: float16
  encoding_batch_size: 32
  encoding_length_bucket_window: 128
  encoding_progress_every_batches: 1

feature_generation:
  reaction_t5_model: ../hf_cache/hub/models--sagawa--ReactionT5v2-forward/snapshots/933114058cb2604dc1bf536dbebdfcefbe83d4fc
  reaction_t5_max_length: 512
  reaction_t5_pooling: mean
  unimol_weight_dir: ../unimol_weights
  chiro_num_workers: 1
  chemistry_python: ../.capability-run-py/bin/python
  reaction_chemistry_schema: runs/reactzyme_f3_reaction_smi_paper_v2_4gpu/data/reaction_set/schema.json
  cofactor_dictionary: data/processed/capability_features/train_exact_rhea_reconstructed/cofactor_dictionary.csv

inference:
  device: cuda
  top_k: [1, 5, 10, 25, 50, 100, 144]
  score_batch_size: 32768

output:
  directory: wet_lab/Case1/restricted_setting/runs/f3mc_ec_lambda3_unmapped/reaction_smi

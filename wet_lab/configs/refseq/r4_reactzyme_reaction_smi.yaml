reaction:
  id: tagatose_4_epimerase
  smiles: "[OH:1][CH2:2][C:3](=[O:4])[C@@H:5]([OH:6])[C@@H:7]([OH:8])[C@H:9]([OH:10])[CH2:11][OH:12]>>[OH:1][CH2:2][C:3](=[O:4])[C@@H:5]([OH:6])[C@H:7]([OH:8])[C@H:9]([OH:10])[CH2:11][OH:12]"

model:
  name: R4 ReactZyme reaction_smi, epoch 11
  config: runs/reactzyme_b0_e2r_geometry_v1/configs/recipe/recipe_R4_seed42/reaction_smi/test.yaml
  checkpoint: runs/reactzyme_b0_e2r_geometry_v1/checkpoints/reaction_smi/recipe_R4_seed42/protein-pooling-epoch=11.ckpt

candidate_pool:
  ids: wet_lab/databases/refseq/prokaryotes/five_shards/candidate_ids_prott5_order.txt
  residue_embeddings: wet_lab/databases/refseq/prokaryotes/five_shards/proteins_prott5_residue.h5
  fasta: wet_lab/databases/refseq/prokaryotes/five_shards/proteins.fasta
  metadata_csv: wet_lab/databases/refseq/prokaryotes/five_shards/proteins.csv
  metadata_id_column: protein_id
  target_cache_dir: wet_lab/cache/refseq/prokaryotes/r4_reactzyme_reaction_smi
  protein_embedding: prott5
  score_protein_embedding: prott5
  residue_load_dtype: float16
  validate_finite_on_access: false
  encoding_batch_size: 1024
  encoding_length_bucket_window: 8192
  encoding_progress_every_batches: 25

feature_generation:
  reaction_t5_model: ../hf_cache/hub/models--sagawa--ReactionT5v2-forward/snapshots/933114058cb2604dc1bf536dbebdfcefbe83d4fc
  reaction_t5_max_length: 512
  reaction_t5_pooling: mean
  unimol_weight_dir: ../unimol_weights
  chiro_num_workers: 1
  chemistry_python: ../.capability-run-py/bin/python
  reaction_chemistry_schema: runs/reactzyme_reaction_features_v1/data/reaction_smi/reaction_set/schema.json
  cofactor_dictionary: data/processed/capability_features/train_exact_rhea_reconstructed/cofactor_dictionary.csv

inference:
  device: cuda
  cpu_threads: 16
  top_k: [1, 5, 10, 20, 50, 100]
  score_batch_size: 32768

output:
  directory: wet_lab/runs/refseq/prokaryotes/r4_shards

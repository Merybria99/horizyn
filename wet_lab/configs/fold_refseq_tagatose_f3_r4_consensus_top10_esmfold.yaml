ranking:
  results: wet_lab/reports/refseq/tagatose_4_epimerase_f3_r4_consensus/results.json
  candidate_fasta: wet_lab/databases/refseq/prokaryotes/five_shards/proteins.fasta
  top_k: 10

backend:
  name: esmfold
  model: facebook/esmfold_v1
  device: cuda:0
  cache_dir: wet_lab/cache/esmfold
  esm_half_precision: true
  low_cpu_mem_usage: true
  chunk_size: 64
  max_sequence_length: 1024
  long_sequence_policy: error
  model_seeds: [1]

output:
  directory: wet_lab/structures/refseq_tagatose_4_epimerase_f3_r4_consensus_top10
